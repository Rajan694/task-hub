<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Task Hub Marketplace icon (source for icon.png): a list of commands, the first one playing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- row 1: play + command (full white) -->
  <path d="M55 58 89 78 55 98Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="110" y="66" width="96" height="24" rx="12" fill="#fff"/>
  <!-- rows 2 and 3: idle commands (70% white) -->
  <g fill="#fff" fill-opacity="0.7">
    <circle cx="72" cy="134" r="13"/>
    <rect x="110" y="122" width="96" height="24" rx="12"/>
    <circle cx="72" cy="190" r="13"/>
    <rect x="110" y="178" width="58" height="24" rx="12"/>
  </g>
</svg>
